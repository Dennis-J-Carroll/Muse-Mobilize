name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a PAT with repo scope, only needed if you want signatures
          # stored in a separate repo instead of this one.
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/Dennis-J-Carroll/Muse-Mobilize/blob/main/CLA.md"
          branch: "main"
          allowlist: "Dennis-J-Carroll,dependabot[bot]"
          remote-organization-name: ""
          remote-repository-name: ""
          create-file-commit-message: "chore: create CLA signatures file"
          signed-commit-message: "chore: $contributorName has signed the CLA in #$pullRequestNo"
          custom-notsigned-prcomment: |
            Thanks for the pull request! Before it can be merged, please sign the
            [Contributor License Agreement](CLA.md) — this is required because
            Muse · Mobilize is licensed under AGPL-3.0, and contributor consent is
            needed to keep future relicensing options open.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
